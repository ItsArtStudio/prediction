spring.application.name=predictions

spring.datasource.url=jdbc:h2:mem:predictions;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

sports.api-football.base-url=https://v3.football.api-sports.io
sports.api-football.api-key=${API_FOOTBALL_KEY:}
sports.api-football.premier-league-id=39
sports.api-football.season=2026
sports.api-football.cache-ttl=2m
sports.api-football.live-cache-ttl=1m

auth.session-ttl=30d
auth.social.google.client-id=${GOOGLE_CLIENT_ID:}
auth.social.apple.client-id=${APPLE_CLIENT_ID:}
auth.social.facebook.app-id=${FACEBOOK_APP_ID:}
auth.social.facebook.app-secret=${FACEBOOK_APP_SECRET:}
